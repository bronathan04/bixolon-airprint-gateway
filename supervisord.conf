[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:dbus]
command=/usr/bin/dbus-daemon --system --nofork --nopidfile
autorestart=true
priority=1
stdout_logfile=/var/log/supervisor/dbus.log
stderr_logfile=/var/log/supervisor/dbus.log

[program:avahi]
command=/usr/sbin/avahi-daemon --no-drop-root --no-chroot
autorestart=true
priority=2
startsecs=3
stdout_logfile=/var/log/supervisor/avahi.log
stderr_logfile=/var/log/supervisor/avahi.log

[program:cupsd]
; Docker's default RLIMIT_NOFILE (1048576) triggers a known cupsd bug
; ("cupsdDoSelect() failed - Bad address!") that crash-loops the scheduler;
; lowering the fd limit before exec avoids it.
command=/bin/bash -c "ulimit -n 1024 && exec /usr/sbin/cupsd -f"
autorestart=true
priority=3
startsecs=3
stdout_logfile=/var/log/supervisor/cupsd.log
stderr_logfile=/var/log/supervisor/cupsd.log

[program:webui]
command=/opt/venv/bin/gunicorn -w 1 -b 0.0.0.0:8080 --chdir /opt/app server:app
autorestart=true
priority=4
startsecs=3
stdout_logfile=/var/log/supervisor/webui.log
stderr_logfile=/var/log/supervisor/webui.log
